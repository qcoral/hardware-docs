server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # gzip text-based assets
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Astro builds pages as directory-style URLs (/page/index.html).
    # Try the file, then the directory, then a .html fallback, else 404.
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Long-cache fingerprinted build assets
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Pagefind search index/assets must be served as-is
    location /pagefind/ {
        try_files $uri =404;
    }

    # Serve Astro's custom 404 page
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
